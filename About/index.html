<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Share</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
      <div class="auth-container">
        <div class="auth-box">

            <div class="tab-switch">
                <button type="button" id="userTab" class="tab-btn active">Student login</button>
                <button type="button" id="adminTab" class="tab-btn">Admin Login</button>
            </div>


            <h2 id="loginTitle">Student Portal</h2>
            <p id="loginSubtitle" class="subtitle">Log in to access campus chargers, books and more.</p>

            <form id="loginForm" class="auth-form">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="yourname25@navgurukul.org" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="********" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Sign In as Student</button>
             </form>

             <p class="auth-redirect" id="redirectText">
                New to the platform? <a href="register.html">Create an account</a>
             </p>
        </div>
      </div>

      <script src="login.js"></script>
      
</body>
</html>
